name: Ecosystem contract check

# Forge releases independently. This job proves the contracts it consumes from
# the Ultimate AI Starter Bundle and Reverse THIS! still exist and still name
# this release. It reads both projects and never edits or copies them.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    name: Bundle and Reverse THIS! contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Check ecosystem contracts
        run: python scripts/check_ecosystem.py
