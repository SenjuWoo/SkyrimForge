name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.23.2"
          cache: false
      - name: Verify tag and toolchain
        run: |
          VERSION=$(python -c "from skyrim_forge.version import VERSION; print(VERSION)")
          test "$GITHUB_REF_NAME" = "v$VERSION"
          test "$(go env GOVERSION)" = "go1.23.2"
      - name: Full publication validation
        run: python scripts/validate_repository.py --scope full --write-reports
      - name: Build release assets
        run: |
          mkdir -p dist
          python scripts/build_release_archive.py "dist/Skyrim-Forge-${GITHUB_REF_NAME#v}.zip"
          python -c "import forge_build_backend; forge_build_backend.build_wheel('dist'); forge_build_backend.build_sdist('dist')"
          cp VALIDATION.json BUILD-RECEIPT.json MANIFEST.json SBOM.spdx.json dist/
          (cd dist && sha256sum * > SHA256SUMS.txt)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: dist/
          if-no-files-found: error
      - name: Publish release without replacing assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python scripts/publish_release.py "$GITHUB_REF_NAME" dist
